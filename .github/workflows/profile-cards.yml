name: Update profile cards

# The public Vercel instances (readme-stats, activity-graph, trophy) are paused/disabled,
# so every card is generated here and published to the `output` branch — no third-party hosting needed.

on:
  schedule:
    - cron: "0 3 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-cards.yml"]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&theme=tokyonight&hide_border=true&border_radius=10
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=tokyonight&hide_border=true&border_radius=10
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Trophies query cross-repo user data, which the repo-scoped GITHUB_TOKEN can't read.
      # Needs a PAT (read:user) in the TROPHY_TOKEN secret; never blocks the other cards.
      - name: Trophies
        continue-on-error: true
        uses: Erik-Donath/github-profile-trophy@eb0893b31de06841663555d10aa43eb7cf27952f # feature/generate-svg
        with:
          username: ${{ github.repository_owner }}
          file: profile/trophy.svg
          theme: tokyonight
          max-cols: "6"
          max-rows: "2"
          margin-width: "10"
          margin-height: "10"
          no-frame: "true"
          no-background: "true"
          token: ${{ secrets.TROPHY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake-dark.svg?palette=github-dark
            profile/snake-light.svg

      # main is protected (PRs only), so the generated cards live on an orphan `output`
      # branch that is force-pushed each run; README embeds them from there.
      - name: Publish cards to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan output
          git rm -rf --cached --quiet .
          git add -f profile profile-3d-contrib
          git commit -m "Update profile cards"
          git push -f origin output
